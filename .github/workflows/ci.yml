name: CI

on:
  pull_request:
  push:
    branches:
      - rebuild-split
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:${{ github.workspace }}/ci.db
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Push Prisma schema
        run: pnpm prisma db push

      - name: Seed database
        run: pnpm prisma:seed

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Run PoXter checks
        run: pnpm check:poxter
